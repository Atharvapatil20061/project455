{% extends "base.html" %}

{% block title %}Sign In | Online Study Hub{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 4rem 1.5rem 6rem;">
  
  <div class="card" style="max-width: 440px; margin: 0 auto; padding: 2.5rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-book-half"></i>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px;">Welcome Back</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        Sign in to access your planner, streak, and study rooms.
      </p>
    </div>

    <!-- Quick Demo Login Banner -->
    <div style="background: var(--primary-light); border: 1px solid rgba(79, 70, 229, 0.25); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem; text-align: center;">
      <div style="font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem;">
        Want to explore immediately?
      </div>
      <a href="{{ url_for('demo_login') }}" class="btn btn-primary btn-sm" style="width: 100%;">
        <i class="bi bi-lightning-charge-fill"></i> Instant 1-Click Demo Login
      </a>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. alex_learner" required>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" style="font-weight: 700;">Create one free</a>
    </div>

  </div>

</div>
{% endblock %}
