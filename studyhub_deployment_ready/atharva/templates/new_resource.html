{% extends "base.html" %}

{% block title %}Contribute Study Guide | Online Study Hub{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 3rem 1.5rem 5rem;">
  <div style="margin-bottom: 2rem;">
    <h1 style="font-size: 2.2rem; font-weight: 800;">Share a Study Guide or Notes</h1>
    <p style="color: var(--text-muted);">
      Help peers succeed by publishing structured explanations, summaries, code samples, or formula sheets.
    </p>
  </div>

  <div class="card" style="padding: 2.5rem;">
    <form method="POST" action="{{ url_for('new_resource') }}">
      <div class="form-group">
        <label class="form-label">Resource Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. Master Binary Search & Two Pointers in Python" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Subject</label>
          <select name="subject" class="form-control">
            {% for s in subjects_list %}
              <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Category Format</label>
          <select name="category" class="form-control">
            <option value="Study Notes">Study Notes</option>
            <option value="Cheat Sheet">Cheat Sheet</option>
            <option value="Full Guide">Full Guide</option>
            <option value="Practice Problems">Practice Problems</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Difficulty</label>
          <select name="difficulty" class="form-control">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Short Summary (1-2 sentences)</label>
        <input type="text" name="description" class="form-control" placeholder="Brief hook describing what students will learn..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Key Takeaways (Bullet Points)</label>
        <textarea name="key_takeaways" class="form-control" style="min-height: 80px;" placeholder="• Main theorem or algorithm
• Common gotchas and edge cases
• Key formulas or time complexity"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Complete Content (Markdown Supported: # Headers, ```code, etc.)</label>
        <textarea name="content" class="form-control" style="min-height: 250px; font-family: var(--font-mono); font-size: 0.9rem;" placeholder="# Introduction

Write your comprehensive study guide here. You can include:
- Code blocks in ```python or ```javascript
- Formula explanations
- Diagrams and step-by-step proofs" required></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
        <a href="{{ url_for('resources') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-cloud-arrow-up-fill"></i> Publish Resource
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
