{% extends "base.html" %}

{% block title %}Ask a Question | Community Forum{% endblock %}

{% block content %}
<div class="container container-narrow" style="padding: 3rem 1.5rem 5rem;">
  
  <div style="margin-bottom: 2rem;">
    <h1 style="font-size: 2.2rem; font-weight: 800;">Ask the StudyHub Community</h1>
    <p style="color: var(--text-muted);">
      Get help on tricky algorithm problems, math derivations, physics models, or focus strategies.
    </p>
  </div>

  <div class="card" style="padding: 2.5rem;">
    <form method="POST" action="{{ url_for('new_topic') }}">
      <div class="form-group">
        <label class="form-label">Question Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. How does Dijkstra's Algorithm handle uniform edge weights vs BFS?" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select name="category" class="form-control">
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Study Techniques">Study Techniques</option>
            <option value="Web Development">Web Development</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Tags (comma-separated)</label>
          <input type="text" name="tags" class="form-control" placeholder="e.g. algorithms, graph, dijkstra">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Detailed Explanation / Context</label>
        <textarea name="content" class="form-control" style="min-height: 200px;" placeholder="Explain the problem in detail, what you've tried so far, and where you're getting stuck..." required></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="{{ url_for('community') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-send-fill"></i> Post Question
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
